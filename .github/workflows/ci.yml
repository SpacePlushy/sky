name: CI

on:
  push:
  pull_request:
  # Weekly run with no code change. A new .NET runtime or OS math library can change
  # floating-point results, and the tolerances must keep holding when that happens.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    # Each OS ships a different math library (glibc, Apple libm, the Windows CRT), so the
    # verification tests run on all three to prove the tolerances hold everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Sky.slnx

      - name: Build
        run: dotnet build Sky.slnx --no-restore --configuration Release

      - name: Lint (formatting and code style)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Sky.slnx --no-restore --verify-no-changes

      - name: Test
        run: dotnet test --solution Sky.slnx --no-build --configuration Release

  web:
    name: Web (type check, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker image (no private files, offline smoke test)
    needs: [build-test, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A stand-in for the owner's gitignored real-location file. It must never reach the image.
      - name: Plant a private settings file
        run: echo '{"Observer":{"Name":"PRIVATE-SENTINEL-7c1f"}}' > src/Sky.Cli/appsettings.Local.json

      - name: Build
        run: docker compose build

      - name: The image holds no private settings
        run: docker run --rm --entrypoint sh sky-over-phoenix:local -c 'command -v grep >/dev/null && ! grep -rq PRIVATE-SENTINEL-7c1f /app'

      - name: Run offline and check the API and the page
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/config | tee config.json
          grep -q '"offline":true' config.json
          grep -q 'Arizona State Capitol' config.json
          curl -fsS http://127.0.0.1:8080/api/satellites/25544/now | grep -q '"timeUtc":"2026-09-24T04:0'
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<!doctype html'

      - name: Logs and shutdown
        if: always()
        run: |
          docker compose logs
          docker compose down
