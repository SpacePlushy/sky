name: CI

on:
  push:
  pull_request:
  # Weekly run with no code change. A new .NET runtime or OS math library can change
  # floating-point results, and the tolerances must keep holding when that happens.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    # Each OS ships a different math library (glibc, Apple libm, the Windows CRT), so the
    # verification tests run on all three to prove the tolerances hold everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Sky.slnx

      - name: Build
        run: dotnet build Sky.slnx --no-restore --configuration Release

      - name: Lint (formatting and code style)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Sky.slnx --no-restore --verify-no-changes

      - name: Test
        run: dotnet test --solution Sky.slnx --no-build --configuration Release

  web:
    name: Web (type check, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker image (no private files, offline smoke test)
    needs: [build-test, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stand-ins for the owner's gitignored private files. They must never reach any image layer.
      - name: Plant private files
        run: |
          echo '{"Observer":{"Name":"PRIVATE-SENTINEL-7c1f"}}' > src/Sky.Cli/appsettings.Local.json
          echo 'VITE_SENTINEL=PRIVATE-SENTINEL-7c1f' > web/.env.local

      - name: Build
        run: docker compose build

      # Scan the whole image filesystem from outside, with no permission checks. The export must
      # succeed and grep must report "not found" (1) exactly: found (0), a grep error (2), or a
      # failed export all fail the step. Each status is read separately, since the runner's
      # bash -e -o pipefail would otherwise stop at grep's 1 or let it mask the export's status.
      - name: The image holds no private files
        shell: bash
        run: |
          cid=$(docker create sky-over-phoenix:local)
          set +e
          docker export "$cid" | grep -aq PRIVATE-SENTINEL-7c1f
          status=("${PIPESTATUS[@]}")
          set -e
          docker rm "$cid" >/dev/null
          echo "docker export exited ${status[0]}; grep exited ${status[1]} (1 means not found)"
          test "${status[0]}" -eq 0 && test "${status[1]}" -eq 1

      # The build stages too: the web stage copies web/ and Vite would load a .env.local there.
      - name: The build stages hold no private files
        shell: bash
        run: |
          docker build --target web -t sky-web-stage .
          cid=$(docker create sky-web-stage)
          set +e
          docker export "$cid" | grep -aq PRIVATE-SENTINEL-7c1f
          status=("${PIPESTATUS[@]}")
          set -e
          docker rm "$cid" >/dev/null
          echo "docker export exited ${status[0]}; grep exited ${status[1]} (1 means not found)"
          test "${status[0]}" -eq 0 && test "${status[1]}" -eq 1

      - name: Run offline and check the API and the page
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/config | tee config.json
          grep -q '"offline":true' config.json
          grep -q 'Arizona State Capitol' config.json
          curl -fsS http://127.0.0.1:8080/api/satellites/25544/now | grep -q '"timeUtc":"2026-09-24T04:0'
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<!doctype html'

      - name: Logs and shutdown
        if: always()
        run: |
          docker compose logs
          docker compose down

  e2e:
    name: End to end (Playwright, Chromium, offline)
    needs: [build-test, web]
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx playwright install --with-deps chromium
        working-directory: web

      # The servers run the API offline with the demo cache; any request to another host fails a test.
      - run: npm run e2e
        working-directory: web

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
